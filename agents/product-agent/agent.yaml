id: product-agent
name: Product Agent
speciality: product-discovery-and-requirements
#model: claude-3-5-sonnet-20241022
#provider: anthropic
#model: gpt-4o
model: gpt-5.4-mini
provider: openai
temperature: 0.7
max_tokens: 4096

inputs:
  - raw_product_vision
  - business_goals
  - personas
  - constraints

outputs:
  - refined_vision
  - prd
  - epics
  - user_stories
  - acceptance_criteria

github_outputs:
  issues: true
  labels: true
  milestones: true

approval_required:
  - prd_finalization
  - github_issue_creation
