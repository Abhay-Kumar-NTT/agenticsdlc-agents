id: qa-engineer
name: QA Engineer
speciality: testing-and-quality-assurance
model: claude-haiku-4-5
provider: anthropic
temperature: 0.7
max_tokens: 4096

inputs:
  - requirements
  - user_stories
  - implementation_code
  - test_scenarios

outputs:
  - test_plans
  - test_cases
  - automated_tests
  - test_results
  - bug_reports

github_outputs:
  issues: true
  pull_request_comments: true
  test_reports: true

approval_required: []
