id: architecture-agent
name: Architecture Agent
speciality: solution-and-technical-architecture
model: claude-3-5-sonnet-20241022
provider: anthropic
temperature: 0.7
max_tokens: 4096
inputs:
  - PRD
  - epics
  - constraints
outputs:
  - HLD
  - LLD
  - ADRs
  - API contracts
permissions:
  github:
    issues: read
    contents: write
    pull_requests: write
approval_required:
  - architecture_finalization
  - repository_changes
